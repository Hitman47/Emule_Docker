# ╔══════════════════════════════════════════════════════════════╗
# ║  aMule ZimaBoard Edition                                    ║
# ║  Conçu pour fonctionner derrière un stack Gluetun existant ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Les ports sont exposés sur le conteneur Gluetun,
# pas sur le conteneur aMule (network_mode: service:gluetun).

services:

  # ── VPN (adapte à ta config Gluetun existante) ──
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${NORDVPN_PRIVATE_KEY}
      - SERVER_COUNTRIES=Netherlands
      - TZ=Europe/Paris
      # ── Port forwarding (essentiel pour High ID / sources) ──
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=nordvpn
      # Règles firewall pour laisser passer aMule
      - FIREWALL_INPUT_PORTS=4662,4711,4712,8078
      - FIREWALL_OUTBOUND_SUBNETS=0.0.0.0/0
    ports:
      # aMule P2P (à ouvrir sur ta box/routeur)
      - "4662:4662"       # ED2K TCP
      - "4665:4665/udp"   # ED2K global search UDP
      - "4672:4672/udp"   # ED2K UDP
      # aMule Web UI classique
      - "4711:4711"
      # EC (External Connections)
      - "4712:4712"
      # Dashboard custom
      - "8078:8078"
    volumes:
      - gluetun-data:/gluetun
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9999/v1/openvpn/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── aMule + Dashboard ──
  amule:
    build: .
    container_name: amule
    network_mode: "service:gluetun"

    # NOTE: depends_on n'est respecté que par `docker compose up`. Après un reboot
    # du NAS, Docker relance les conteneurs sans ordre garanti : c'est l'entrypoint
    # qui attend le tunnel (VPN_WAIT_TIMEOUT). Et comme le réseau d'aMule est celui
    # de Gluetun, recréer Gluetun impose de recréer aMule :
    #   docker compose up -d --force-recreate gluetun amule
    depends_on:
      gluetun:
        condition: service_healthy

    # amuled écrit ses .met/.part.met à l'arrêt. Avec les 10s par défaut il était
    # SIGKILL en plein écriture -> fichiers tronqués -> abort (code 134) au
    # démarrage suivant. L'entrypoint attend AMULE_STOP_GRACE, Docker attend un
    # peu plus longtemps.
    stop_grace_period: 90s

    # tini : reaping des zombies (cron, scripts) + transmission des signaux
    init: true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris

      # Démarrage : attente du tunnel VPN avant de lancer aMule (0 = pas d'attente)
      - VPN_WAIT_TIMEOUT=180
      # Arrêt : secondes laissées à amuled pour sauvegarder son état
      - AMULE_STOP_GRACE=55

      # Mots de passe (utilise un .env !)
      - GUI_PWD=${AMULE_GUI_PWD:-ChangeMe2025!}
      - WEBUI_PWD=${AMULE_WEBUI_PWD:-ChangeMe2025!}

      # Dashboard
      - DASHBOARD_ENABLED=true
      - DASHBOARD_PORT=8078
      - DASHBOARD_PWD=${DASHBOARD_PWD:-ChangeMe2025!}

      # Mods originaux
      - MOD_AUTO_RESTART_ENABLED=true
      - MOD_AUTO_RESTART_CRON=0 5 * * *
      - MOD_FIX_KAD_GRAPH_ENABLED=true
      - MOD_FIX_KAD_BOOTSTRAP_ENABLED=true
      - MOD_AUTO_SHARE_ENABLED=false

      # Nouvelles features
      - SERVER_UPDATE_ENABLED=true
      - SERVER_UPDATE_CRON=0 4 * * *
      - BACKUP_ENABLED=true
      - BACKUP_CRON=0 3 * * 0
      - BACKUP_KEEP=4

      # Source Boost
      # Important: l'auto-pause 0 source est désactivé par défaut,
      # sinon des téléchargements eD2k légitimes finissent "Paused"
      # alors qu'ils sont juste en attente de sources.
      - SOURCE_BOOST_AUTO_PAUSE_ENABLED=false
      - SOURCE_BOOST_ZERO_SRC_TIMEOUT=3600

      # Limites performance ZimaBoard 832
      - AMULE_MAX_CONNECTIONS=500
      - AMULE_MAX_SOURCES_PER_FILE=800
      - AMULE_MAX_CONN_PER_5SEC=60
      - AMULE_DOWNLOAD_CAPACITY=300
      - AMULE_UPLOAD_CAPACITY=80

    volumes:
      - ./data/amule-config:/home/amule/.aMule
      - ./data/downloads:/downloads
      - ./data/backups:/backups
      - ./data/logs:/var/log/amule-diag

    # aMule keeps many sockets open; raise the fd limit
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

    # Bound container logs (dashboard + amuled are chatty)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    restart: unless-stopped

volumes:
  gluetun-data:
